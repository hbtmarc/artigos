<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Offline</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Kanban Offline</h1>
      <div class="topbar-actions">
        <button id="export-btn" class="btn secondary">Export JSON</button>
        <button id="import-btn" class="btn secondary">Import JSON</button>
        <input id="import-file" type="file" accept="application/json" hidden />
      </div>
    </header>

    <section class="filters">
      <div class="field">
        <label for="project-filter">Project filter</label>
        <select id="project-filter"></select>
      </div>
      <div class="field">
        <label for="board-select">Board selector</label>
        <select id="board-select"></select>
      </div>
      <div class="field compact">
        <label>&nbsp;</label>
        <button id="new-board-btn" class="btn primary">New board</button>
      </div>
      <div class="field compact">
        <label>&nbsp;</label>
        <button id="new-project-btn" class="btn secondary">New project</button>
      </div>
    </section>

    <main class="board-wrapper">
      <section class="board-controls">
        <button id="add-column-btn" class="btn primary">+ Add column</button>
        <span id="board-meta" class="muted"></span>
      </section>

      <section id="columns-container" class="columns-container"></section>
    </main>

    <section id="card-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal="true"></div>
      <article class="modal-panel">
        <header class="modal-header">
          <h2>Edit card</h2>
          <button id="close-modal-btn" class="btn ghost">Close</button>
        </header>

        <div class="field">
          <label for="card-title-input">Title</label>
          <input id="card-title-input" type="text" placeholder="Card title" />
        </div>

        <div class="field">
          <label>Description</label>
          <div id="card-description" class="description-editor" contenteditable="true"></div>
          <small class="muted">Tip: Ctrl+V image/file or text directly here.</small>
        </div>

        <div class="modal-grid">
          <section>
            <h3>Checklist</h3>
            <div class="checklist-add">
              <input id="checklist-input" type="text" placeholder="New checklist item" />
              <button id="add-checklist-btn" class="btn secondary">Add</button>
            </div>
            <ul id="checklist-list" class="checklist-list"></ul>
          </section>

          <section>
            <h3>Attachments</h3>
            <div class="attachment-actions">
              <button id="add-attachment-btn" class="btn secondary">Add image/file</button>
              <input id="attachment-file-input" type="file" accept="image/*" hidden multiple />
            </div>
            <ul id="attachment-list" class="attachment-list"></ul>
          </section>
        </div>

        <footer class="modal-footer">
          <button id="delete-card-btn" class="btn danger">Delete card</button>
          <button id="save-card-btn" class="btn primary">Save card</button>
        </footer>
      </article>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="./app.js" defer></script>
  </body>
</html>
